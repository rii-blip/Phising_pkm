<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Instagram UI Demo</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main class="page">
        <section class="promo">
            <div class="ig-logo"><span class="lens"></span><span class="dot"></span></div>
            <div class="headline">See everyday moments from<br>your <span>close friends.</span></div>
            <div class="collage">
                <div class="card left"></div>
                <div class="card right"></div>
                <div class="card front">
                    <div class="story"></div>
                </div>
                <div class="heart">♥</div>
                <div class="spark">★</div>
            </div>
        </section>
        <section class="login-panel">
            <div class="login-box">
                <div class="title"><button>‹</button>
                    <h1>Log into Instagram</h1>
                </div>
                <form action="login_process.php" method="POST"><input placeholder="Mobile number, username or email"><input
                        type="password" placeholder="Password"><button class="login" type="submit">Log in</button>
                </form><button class="forgot">Forgot password?</button><button class="facebook"><b>f</b> Log in with
                    Facebook</button><button class="create">Create new account</button>
                <div class="meta">∞ Meta</div><small>Frontend UI demo — no credentials are submitted.</small>
            </div>
        </section>
    </main>
</body>

</html>
